# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  #vmImage: ubuntu-latest
  name: Default

steps:
- task: PowerShell@2
  displayName: 'Validar integridad del proyecto GameMaker (.yyp)'
  inputs:
    filePath: 'scr_pipeline/validate_yyp.ps1'

- task: PowerShell@2
  displayName: 'Preparar ZIP de Windows desde build/win'
  inputs:
    targetType: 'inline'
    script: |
      $winDir = Join-Path $(Build.SourcesDirectory) "builds\win"
      $zipFiles = Get-ChildItem -Path $winDir -Filter "*.zip" -ErrorAction SilentlyContinue

      if (-not $zipFiles) {
          Write-Error "No se encontro ningun .zip en build\win. Exporta el juego desde GameMaker primero."
          exit 1
      }
      if ($zipFiles.Count -gt 1) {
          Write-Error "Hay mas de un .zip en build\win. Deja solo la exportacion actual."
          exit 1
      }

      $sourceZip = $zipFiles[0].FullName
      $destZip = Join-Path $(Build.ArtifactStagingDirectory) "BattleArenaChallenge-win-$(Build.BuildNumber).zip"
      Copy-Item -Path $sourceZip -Destination $destZip -Force
      Write-Host "Artefacto listo en: $destZip"

- task: PublishPipelineArtifact@1
  displayName: 'Publicar artefacto de Windows'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)'
    artifact: 'Cliente-Windows'
    publishLocation: 'pipeline'

- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'

